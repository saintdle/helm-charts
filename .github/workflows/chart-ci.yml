name: Chart CI

# Keep both check names stable and run them for every pull request. The version
# gate enforces this repository's generated-only ownership; manifests exercises
# the artifact, authority, immutable-record, retry, and history publication paths.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: chart-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version-gate:
    name: version-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject reintroduced chart source or legacy publisher inputs
        run: node --test tools/chart-generated-only.test.mjs

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate generated chart distribution and recovery
        run: node --test tools/chart-artifact.test.mjs tools/chart-authority.test.mjs tools/chart-generated-only.test.mjs tools/chart-publication.test.mjs
