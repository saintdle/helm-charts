name: Chart CI

# Runs on every pull request so the two required checks always report a status
# (a required check that never runs would block the PR forever). version-gate
# and manifests remain the required checks. manifests aggregates the static
# chart contracts, exact-candidate lifecycle jobs, and promotion-state regression before rendering a preview.
#   * version-gate — fails unless charts/pacman/Chart.yaml `version` is bumped
#     to a new, unreleased value when the chart changes. This is the "new version
#     must be declared" flag that must be green before the PR can merge.
#   * manifests — fails if any static or lifecycle lane fails, then renders the
#     manifests for both backends, posts a preview, and uploads the artifact.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CHART_DIR: charts/pacman
  HELM_VERSION: v3.16.4
  PAGES_URL: https://saintdle.github.io/helm-charts

concurrency:
  group: chart-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version-gate:
    name: version-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a new chart version
        run: |
          set -euo pipefail
          name=$(yq '.name' "$CHART_DIR/Chart.yaml")
          pr_version=$(yq '.version' "$CHART_DIR/Chart.yaml")

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

          # Only require a version bump when the chart itself changed. A PR that
          # only touches workflows or docs does not need a new chart version.
          if git diff --quiet FETCH_HEAD -- "$CHART_DIR"; then
            echo "No changes under $CHART_DIR in this PR; version bump not required."
            echo "### Version gate skipped (chart unchanged)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git cat-file -e "FETCH_HEAD:$CHART_DIR/Chart.yaml" 2>/dev/null; then
            base_version=$(git show "FETCH_HEAD:$CHART_DIR/Chart.yaml" | yq '.version')
          else
            base_version="(new chart)"
          fi

          echo "Chart:         $name"
          echo "Base version:  $base_version"
          echo "PR version:    $pr_version"

          fail() { echo "::error file=$CHART_DIR/Chart.yaml::$1"; exit 1; }

          if [ "$pr_version" = "null" ] || [ -z "$pr_version" ]; then
            fail "Chart.yaml has no version field."
          fi

          if [ "$base_version" != "(new chart)" ]; then
            if [ "$pr_version" = "$base_version" ]; then
              fail "Chart.yaml version is still $pr_version. Bump it to a new version before this PR can merge."
            fi
            greatest=$(printf '%s\n%s\n' "$base_version" "$pr_version" | sort -V | tail -1)
            if [ "$greatest" != "$pr_version" ]; then
              fail "PR version $pr_version must be greater than the base version $base_version."
            fi
          fi

          if git ls-remote --tags origin "refs/tags/${name}-${pr_version}" | grep -q .; then
            fail "${name}-${pr_version} is already released (a tag exists). Pick a new version."
          fi

          {
            echo "### Version gate passed"
            echo ""
            echo "| Chart | Base | This PR |"
            echo "|-------|------|---------|"
            echo "| \`$name\` | \`$base_version\` | \`$pr_version\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  detect:
    name: detect-chart-change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      promotion_state_changed: ${{ steps.detect.outputs.promotion_state_changed }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect chart contract change
        id: detect
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet FETCH_HEAD -- "$CHART_DIR" tools/check-pacman-*.sh pacman-promotion-state.json .github/workflows/chart-ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet FETCH_HEAD -- pacman-promotion-state.json tools/pacman-promotion.test.mjs .github/workflows/chart-ci.yml; then
            echo "promotion_state_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "promotion_state_changed=true" >> "$GITHUB_OUTPUT"
          fi

  promotion-state-regression:
    name: promotion-state-regression
    needs: detect
    if: needs.detect.outputs.promotion_state_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test promotion state identity
        run: node --test tools/pacman-promotion.test.mjs

  chart-contracts:
    name: chart-contracts
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Verify application probe contract
        run: bash tools/check-pacman-probes.sh "$CHART_DIR"

      - name: Verify PostgreSQL migration lifecycle
        run: bash tools/check-pacman-postgres-migration.sh "$CHART_DIR"

      - name: Verify fault-demo contract
        run: bash tools/check-pacman-fault-demo.sh "$CHART_DIR"

      - name: Verify optional-resource contract
        run: bash tools/check-pacman-optional-resources.sh "$CHART_DIR"

  candidate-identity:
    name: candidate-identity
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Validate the promoted app source identity
        id: identity
        run: |
          set -euo pipefail
          source_repository=$(jq -r '.app.source_repository // ""' pacman-promotion-state.json)
          source_commit=$(jq -r '.app.source_commit // ""' pacman-promotion-state.json)
          state_version=$(jq -r '.app.version // ""' pacman-promotion-state.json)
          state_digest=$(jq -r '.app.image_manifest_list_digest // ""' pacman-promotion-state.json)
          chart_version=$(yq -r '.appVersion' "$CHART_DIR/Chart.yaml")
          values_digest=$(yq -r '.image.digest' "$CHART_DIR/values.yaml")

          [[ "$source_repository" == https://github.com/saintdle/pacman ]] || {
            echo "promotion record does not identify the Pac-Man source repository" >&2
            exit 1
          }
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "promotion record source commit must be a full lowercase Git SHA" >&2
            exit 1
          }
          [[ "$state_version" == "$chart_version" ]] || {
            echo "promotion app version $state_version does not match chart appVersion $chart_version" >&2
            exit 1
          }
          [[ "$state_digest" =~ ^sha256:[0-9a-f]{64}$ && "$state_digest" == "$values_digest" ]] || {
            echo "promotion app digest does not match the chart's pinned image digest" >&2
            exit 1
          }

          echo "source_sha=$source_commit" >> "$GITHUB_OUTPUT"
          echo "Validated Pac-Man $state_version at $source_commit with the chart's pinned digest."

  lifecycle:
    name: lifecycle (${{ matrix.database }})
    needs: [detect, candidate-identity]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [mongo, postgres]
    steps:
      - name: Checkout chart PR candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout the immutable promoted Pac-Man source
        uses: actions/checkout@v5
        with:
          repository: saintdle/pacman
          ref: ${{ needs.candidate-identity.outputs.source_sha }}
          path: pacman-source
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checked-out source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha=$(git -C pacman-source rev-parse HEAD)
          [[ "$source_sha" == "$EXPECTED_SOURCE_SHA" ]] || {
            echo "checked-out Pac-Man source $source_sha does not match promoted source $EXPECTED_SOURCE_SHA" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kind with checksum verification
        env:
          KIND_VERSION: v0.30.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) kind_arch=amd64 ;;
            aarch64|arm64) kind_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$temp_dir/kind-linux-${kind_arch}" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${kind_arch}"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$temp_dir/kind-linux-${kind_arch}.sha256sum" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${kind_arch}.sha256sum"
          grep -F "kind-linux-${kind_arch}" "$temp_dir/kind-linux-${kind_arch}.sha256sum" \
            | (cd "$temp_dir" && sha256sum -c --status)
          sudo install -m 0755 "$temp_dir/kind-linux-${kind_arch}" /usr/local/bin/kind
          kind version
          kubectl version --client=true

      - name: Run install and upgrade lifecycle for both role modes
        env:
          DATABASE: ${{ matrix.database }}
          EXPECTED_SOURCE_SHA: ${{ needs.candidate-identity.outputs.source_sha }}
        run: bash tools/check-pacman-lifecycle.sh "$CHART_DIR" pacman-source "$DATABASE" "$EXPECTED_SOURCE_SHA"

  manifests:
    name: manifests
    needs: [detect, chart-contracts, candidate-identity, lifecycle, promotion-state-regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require every applicable validation lane
        env:
          CHART_CHANGED: ${{ needs.detect.outputs.changed }}
          DETECT_RESULT: ${{ needs.detect.result }}
          CONTRACTS_RESULT: ${{ needs.chart-contracts.result }}
          CANDIDATE_RESULT: ${{ needs.candidate-identity.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          PROMOTION_STATE_CHANGED: ${{ needs.detect.outputs.promotion_state_changed }}
          PROMOTION_STATE_RESULT: ${{ needs['promotion-state-regression'].result }}
        run: |
          set -euo pipefail
          [[ "$DETECT_RESULT" == success ]] || { echo "chart-change detection did not succeed" >&2; exit 1; }
          case "$PROMOTION_STATE_CHANGED" in
            true)
              [[ "$PROMOTION_STATE_RESULT" == success ]] || {
                echo "promotion-state regression completed as $PROMOTION_STATE_RESULT" >&2
                exit 1
              }
              ;;
            false)
              [[ "$PROMOTION_STATE_RESULT" == skipped ]] || {
                echo "unchanged promotion state unexpectedly ran regression as $PROMOTION_STATE_RESULT" >&2
                exit 1
              }
              ;;
            *)
              echo "promotion-state change detection did not publish a boolean result" >&2
              exit 1
              ;;
          esac
          case "$CHART_CHANGED" in
            true)
              for lane in CONTRACTS_RESULT CANDIDATE_RESULT LIFECYCLE_RESULT; do
                result="${!lane}"
                [[ "$result" == success ]] || {
                  echo "required chart validation lane $lane completed as $result" >&2
                  exit 1
                }
              done
              echo "All four static chart contracts and both backend lifecycle matrices passed."
              ;;
            false)
              for lane in CONTRACTS_RESULT CANDIDATE_RESULT LIFECYCLE_RESULT; do
                result="${!lane}"
                [[ "$result" == skipped ]] || {
                  echo "unchanged chart unexpectedly ran validation lane $lane as $result" >&2
                  exit 1
                }
              done
              echo "Chart and its contracts are unchanged; chart validation is not applicable."
              echo "### Chart checks skipped (chart unchanged)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "chart-change detection did not publish a boolean result" >&2
              exit 1
              ;;
          esac

      - name: Set up Helm
        if: needs.detect.outputs.changed == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Render manifests and build preview
        id: render
        if: needs.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p rendered
          name=$(yq '.name' "$CHART_DIR/Chart.yaml")
          pr_version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          backends="mongo postgres"

          for db in $backends; do
            helm template "$name" "$CHART_DIR" --namespace pacman-demo \
              --set database="$db" > "rendered/${db}.yaml"
          done

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          have_base=false
          if git cat-file -e "FETCH_HEAD:$CHART_DIR/Chart.yaml" 2>/dev/null; then
            git worktree add --detach .base FETCH_HEAD >/dev/null 2>&1 || true
            if [ -d ".base/$CHART_DIR" ]; then
              have_base=true
              for db in $backends; do
                helm template "$name" ".base/$CHART_DIR" --namespace pacman-demo \
                  --set database="$db" > "rendered/base-${db}.yaml" 2>/dev/null || : > "rendered/base-${db}.yaml"
              done
            fi
          fi

          {
            echo "<!-- chart-manifest-preview -->"
            echo "## Rendered manifest preview"
            echo ""
            echo "Chart \`$name\` version \`$pr_version\`. Full manifests for both"
            echo "backends are attached as the **rendered-manifests** artifact on this run."
            echo ""
            for db in $backends; do
              echo "<details><summary>Backend <code>${db}</code></summary>"
              echo ""
              if [ "$have_base" = true ]; then
                if diff -u "rendered/base-${db}.yaml" "rendered/${db}.yaml" > "rendered/diff-${db}.patch"; then
                  echo "_No change to rendered manifests versus the base branch._"
                else
                  echo "Diff versus base branch:"
                  echo ""
                  echo '```diff'
                  head -c 25000 "rendered/diff-${db}.patch"
                  echo ""
                  echo '```'
                fi
              else
                echo "New chart. Rendered output (truncated, see artifact for full):"
                echo ""
                echo '```yaml'
                head -c 25000 "rendered/${db}.yaml"
                echo ""
                echo '```'
              fi
              echo ""
              echo "</details>"
              echo ""
            done
          } > rendered/comment.md

          rm -f rendered/base-*.yaml rendered/diff-*.patch
          git worktree remove --force .base 2>/dev/null || true

      - name: Upload rendered manifests
        if: always() && needs.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: rendered-manifests
          path: rendered/
          if-no-files-found: warn

      - name: Post preview comment
        if: always() && needs.detect.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('rendered/comment.md', 'utf8');
            } catch (e) {
              body = '<!-- chart-manifest-preview -->\n## Rendered manifest preview\n\nManifest rendering failed. Check the workflow logs.';
            }
            const marker = '<!-- chart-manifest-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
