name: Publish Pac-Man chart artifact

on:
  repository_dispatch:
    types: [pacman-chart-artifact]

permissions:
  contents: write
  actions: read

concurrency:
  group: pacman-chart-publisher
  cancel-in-progress: false

env:
  PAGES_URL: https://saintdle.github.io/helm-charts
  HELM_VERSION: v3.16.4

jobs:
  publish:
    name: verify and publish generated chart
    if: vars.PACMAN_CHART_PUBLISHER_AUTHORITY == 'pacman'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the distribution repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm generated publisher authority
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: node tools/chart-authority.mjs pacman

      - name: Verify the exact Pac-Man main source candidate before checkout
        id: validate_source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          validation=$(node tools/chart-artifact.mjs validate-candidate)
          echo "$validation"
          source_sha=$(jq -er '.sourceCommit | strings | select(test("^[a-f0-9]{40}$"))' <<< "$validation")
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out only the authoritative release record codec
        uses: actions/checkout@v5
        with:
          repository: saintdle/pacman
          ref: ${{ steps.validate_source.outputs.source_sha }}
          path: pacman-codec
          sparse-checkout: tools/release-records.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Confirm checked-out codec source identity
        env:
          EXPECTED_CODEC_SHA: ${{ steps.validate_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CODEC_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "validated Pac-Man codec source must be a full lowercase SHA" >&2
            exit 1
          }
          actual_codec_sha=$(git -C "$GITHUB_WORKSPACE/pacman-codec" rev-parse HEAD 2>/dev/null) || {
            echo "could not determine checked-out codec SHA" >&2
            exit 1
          }
          [[ "$actual_codec_sha" == "$EXPECTED_CODEC_SHA" ]] || {
            echo "checked-out Pac-Man codec $actual_codec_sha does not match validated source $EXPECTED_CODEC_SHA" >&2
            exit 1
          }

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish immutable package, records, Pages index, and notification
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          PACMAN_RELEASE_RECORDS_CODEC: pacman-codec/tools/release-records.js
        run: node tools/chart-artifact.mjs publish
