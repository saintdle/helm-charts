name: Release chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"

permissions:
  contents: write

concurrency:
  group: pacman-chart-publisher
  cancel-in-progress: false

env:
  CHART_DIR: charts/pacman
  HELM_VERSION: v3.16.4
  PAGES_URL: https://saintdle.github.io/helm-charts

jobs:
  release:
    name: release
    if: vars.PACMAN_CHART_PUBLISHER_AUTHORITY != 'pacman'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Confirm the legacy publisher still owns the chart
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: node tools/chart-authority.mjs helm-charts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Read chart metadata
        id: chart
        run: |
          set -euo pipefail
          {
            echo "name=$(yq '.name' "$CHART_DIR/Chart.yaml")"
            echo "version=$(yq '.version' "$CHART_DIR/Chart.yaml")"
            echo "app_version=$(yq -r '.appVersion' "$CHART_DIR/Chart.yaml")"
            echo "image_digest=$(yq -r '.image.digest' "$CHART_DIR/values.yaml")"
          } >> "$GITHUB_OUTPUT"

      - name: Repair and verify chart publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          APP_VERSION: ${{ steps.chart.outputs.app_version }}
          IMAGE_DIGEST: ${{ steps.chart.outputs.image_digest }}
          CHART_SOURCE_REPOSITORY: ${{ github.repository }}
          CHART_SOURCE_COMMIT: ${{ github.sha }}
        run: node tools/chart-publication.mjs
