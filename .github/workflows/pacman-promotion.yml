name: Promote Pac-Man release

on:
  repository_dispatch:
    types: [pacman-release]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Reconcile releases, propose a rollback, or resume after a rollback
        required: true
        default: reconcile
        type: choice
        options: [reconcile, rollback, resume]
      rollback_app_record_ref:
        description: Immutable app record or verified legacy metadata URL
        required: false
        type: string
      rollback_app_record_sha256:
        description: SHA-256 of the exact referenced asset
        required: false
        type: string
      rollback_reason:
        description: Reason for this rollback proposal
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pacman-chart-publisher
  cancel-in-progress: false

env:
  CHART_DIR: charts/pacman

jobs:
  promotion:
    name: Open one coherent chart promotion PR
    if: vars.PACMAN_CHART_PUBLISHER_AUTHORITY != 'pacman'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Confirm the legacy source promoter still owns the chart
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: node tools/chart-authority.mjs helm-charts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read current chart state
        id: current
        run: |
          set -euo pipefail
          {
            echo "app_version=$(yq -r '.appVersion' "$CHART_DIR/Chart.yaml")"
            echo "chart_version=$(yq -r '.version' "$CHART_DIR/Chart.yaml")"
            echo "image_digest=$(yq -r '.image.digest' "$CHART_DIR/values.yaml")"
            echo "released_tags=$(git tag --list 'pacman-*' | paste -sd, -)"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve a pending rollback proposal
        id: pending
        env:
          PROMOTION_MODE: ${{ inputs.mode || 'reconcile' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pending_app_version=""
          pending_image_digest=""
          pending_chart_version=""
          pending_app_reference=""
          pending_app_sha256=""
          pending_app_source_commit=""
          branch_sha=""
          printf 'null\n' > /tmp/pacman-branch-state.json
          if git fetch --quiet origin +refs/heads/automation/pacman-promotion:refs/remotes/origin/automation/pacman-promotion 2>/dev/null; then
            if ! git show refs/remotes/origin/automation/pacman-promotion:pacman-promotion-state.json > /tmp/pacman-branch-state.json 2>/dev/null; then
              printf 'null\n' > /tmp/pacman-branch-state.json
            fi
            branch_sha=$(git rev-parse refs/remotes/origin/automation/pacman-promotion)
          fi
          gh pr list --repo saintdle/helm-charts --head automation/pacman-promotion --base main --state all \
            --json state,headRefName,headRefOid,baseRefName,baseRefOid,isCrossRepository > /tmp/pacman-promotion-prs.json
          PENDING_BRANCH_SHA="$branch_sha" PENDING_BASE_SHA="$(git rev-parse HEAD)" \
            PENDING_FILTERED_PATH=/tmp/pacman-pending-state.json \
            node tools/pacman-promotion.mjs filter-pending /tmp/pacman-branch-state.json /tmp/pacman-promotion-prs.json
          pending_state=$(cat /tmp/pacman-pending-state.json)
          pending_mode=$(jq -r '.mode // ""' <<< "$pending_state" 2>/dev/null || true)
          if [[ "$PROMOTION_MODE" == "reconcile" && "$pending_mode" == "rollback" ]]; then
            echo "action=noop" >> "$GITHUB_OUTPUT"
            echo "An open rollback proposal for the current branch and base is already pending; reconciliation left it intact."
            exit 0
          fi
          pending_app_version=$(jq -r '.app.version // ""' <<< "$pending_state" 2>/dev/null || true)
          pending_image_digest=$(jq -r '.app.image_manifest_list_digest // ""' <<< "$pending_state" 2>/dev/null || true)
          pending_chart_version=$(jq -r '.chart.version // ""' <<< "$pending_state" 2>/dev/null || true)
          pending_app_reference=$(jq -r '.app.reference // ""' <<< "$pending_state" 2>/dev/null || true)
          pending_app_sha256=$(jq -r '.app.sha256 // ""' <<< "$pending_state" 2>/dev/null || true)
          pending_app_source_commit=$(jq -r '.app.source_commit // ""' <<< "$pending_state" 2>/dev/null || true)
          {
            echo "action=continue"
            echo "app_version=$pending_app_version"
            echo "image_digest=$pending_image_digest"
            echo "chart_version=$pending_chart_version"
            echo "app_reference=$pending_app_reference"
            echo "app_sha256=$pending_app_sha256"
            echo "app_source_commit=$pending_app_source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Verify authoritative app release and plan promotion
        id: plan
        if: steps.pending.outputs.action != 'noop'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PROMOTION_MODE: ${{ inputs.mode || 'reconcile' }}
          ROLLBACK_APP_RECORD_REF: ${{ inputs.rollback_app_record_ref || '' }}
          ROLLBACK_APP_RECORD_SHA256: ${{ inputs.rollback_app_record_sha256 || '' }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason || '' }}
          CURRENT_APP_VERSION: ${{ steps.current.outputs.app_version }}
          CURRENT_CHART_VERSION: ${{ steps.current.outputs.chart_version }}
          CURRENT_IMAGE_DIGEST: ${{ steps.current.outputs.image_digest }}
          CURRENT_STATE_PATH: pacman-promotion-state.json
          RELEASED_CHART_TAGS: ${{ steps.current.outputs.released_tags }}
          PENDING_APP_VERSION: ${{ steps.pending.outputs.app_version }}
          PENDING_IMAGE_DIGEST: ${{ steps.pending.outputs.image_digest }}
          PENDING_CHART_VERSION: ${{ steps.pending.outputs.chart_version }}
          PENDING_APP_RECORD_REFERENCE: ${{ steps.pending.outputs.app_reference }}
          PENDING_APP_RECORD_SHA256: ${{ steps.pending.outputs.app_sha256 }}
          PENDING_APP_SOURCE_COMMIT: ${{ steps.pending.outputs.app_source_commit }}
        run: |
          set -euo pipefail
          node tools/pacman-promotion.mjs plan /tmp/pacman-promotion-plan.json
          {
            echo "action=$(jq -r '.action' /tmp/pacman-promotion-plan.json)"
            echo "title=$(jq -r 'if .action == "rollback-proposal" then "chore(pacman): propose rollback to " + .app.version elif .action == "resume" then "chore(pacman): resume promotion" else "chore(pacman): promote " + .app.version end' /tmp/pacman-promotion-plan.json)"
            echo "app_version=$(jq -r '.app.version // ""' /tmp/pacman-promotion-plan.json)"
            echo "chart_version=$(jq -r '.chart.version // ""' /tmp/pacman-promotion-plan.json)"
            echo "digest=$(jq -r '.app.image_manifest_list_digest // ""' /tmp/pacman-promotion-plan.json)"
            echo "mode=$(jq -r '.action' /tmp/pacman-promotion-plan.json)"
            echo "rollback_reason=$(jq -r '.rollback_reason // ""' /tmp/pacman-promotion-plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Update chart metadata and structured promotion state
        if: steps.plan.outputs.action != '' && steps.plan.outputs.action != 'noop'
        env:
          APP_VERSION: ${{ steps.plan.outputs.app_version }}
          CHART_VERSION: ${{ steps.plan.outputs.chart_version }}
          IMAGE_DIGEST: ${{ steps.plan.outputs.digest }}
        run: |
          set -euo pipefail
          yq -i ".version = \"$CHART_VERSION\" | .appVersion = \"$APP_VERSION\"" "$CHART_DIR/Chart.yaml"
          yq -i ".image.digest = \"$IMAGE_DIGEST\" | .image.tag = \"\"" "$CHART_DIR/values.yaml"
          node tools/pacman-promotion.mjs write-state /tmp/pacman-promotion-plan.json pacman-promotion-state.json
          helm lint "$CHART_DIR"
          git diff --check

      - name: Open or update the single promotion PR
        if: steps.plan.outputs.action != '' && steps.plan.outputs.action != 'noop'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          branch: automation/pacman-promotion
          delete-branch: false
          commit-message: "chore(pacman): reconcile promotion"
          title: ${{ steps.plan.outputs.title }}
          body: |
            Automated Pac-Man promotion proposal.

            - Mode: `${{ steps.plan.outputs.mode }}`
            - Application version: `${{ steps.plan.outputs.app_version }}`
            - Chart version: `${{ steps.plan.outputs.chart_version }}`
            - Image digest: `${{ steps.plan.outputs.digest }}`
            ${{ steps.plan.outputs.rollback_reason != '' && format('- Rollback reason: {0}', steps.plan.outputs.rollback_reason) || '' }}

            This workflow proposes changes only. It does not merge or apply them.
